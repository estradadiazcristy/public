<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>Craneo</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);
    import {RoundedBoxGeometry} from "./js/RoundedBoxGeometry.js"

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x69142B);



// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 25);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

 

// Espacio para colocar los objetos
// GridHelper
/*var gridHelper = new THREE.GridHelper(50,50);
scene.add(gridHelper);

var axesHelper = new THREE.AxesHelper(50);
scene.add(axesHelper);*/
///  💫💢🐭🐭 LUCES



//OBJETOS  ✏️✏️✏️✏️  🪶
var geometry0 = new THREE.BoxGeometry(100,1,100);
var material0 = new THREE.MeshLambertMaterial({
    color:0x180501,
    side: THREE.DoubleSide, 
    });

var mesh0 = new THREE.Mesh(geometry0,material0);
scene.add(mesh0);
mesh0.position.set(0,0,0);
mesh0.receiveShadow = true;




// CRÁNEO 

// Cabeza
var geometryCranio = new THREE.SphereGeometry(2, 32, 32);
var materialCranio = new THREE.MeshBasicMaterial({
    color: 0xE8E0C8
});
var cranio = new THREE.Mesh(geometryCranio, materialCranio);
cranio.scale.set(1.3, 1.15, 1);
cranio.position.set(0, 4, 0);
scene.add(cranio);

var geometryMandibula = new THREE.BoxGeometry(3,2,2);
var mandibula = new THREE.Mesh(geometryMandibula, materialCranio);
mandibula.position.set(0,2.7,0.78);
scene.add(mandibula);

// Ojo izquierdo
var geometryOjo = new THREE.CircleGeometry(.7, 16, 16);
var materialOjo = new THREE.MeshBasicMaterial({
    color: 0x111111
});

var ojo1 = new THREE.Mesh(geometryOjo, materialOjo);
ojo1.position.set(-1,3.7,1.98);
scene.add(ojo1);

// Ojo derecho
var ojo2 = new THREE.Mesh(geometryOjo, materialOjo);
ojo2.position.set(1,3.7,2);
scene.add(ojo2);

var geometryNariz = new THREE.ConeGeometry(0.4, 0.09, 4);
var nariz = new THREE.Mesh(geometryNariz, materialOjo);
nariz.rotation.x = Math.PI / 2;
nariz.position.set(0,3.1, 1.98);
scene.add(nariz);

var geometry01 = new THREE.PlaneGeometry(1.5,.1);
var material01 = new THREE.MeshBasicMaterial({
    color:0x030303,
    side: THREE.DoubleSide });
var mesh01 = new THREE.Mesh(geometry01,material01);
scene.add(mesh01);
mesh01.position.set(0,2.3,1.8);
var geometry02 = new THREE.PlaneGeometry(.1,.5);
var material02 = new THREE.MeshBasicMaterial({
    color:0x030303,
    side: THREE.DoubleSide });
var mesh02 = new THREE.Mesh(geometry02,material02);
scene.add(mesh02);
mesh02.position.set(0,2.3,1.8);
var mesh03 = new THREE.Mesh(geometry02,material02);
scene.add(mesh03);
mesh03.position.set(.5,2.3,1.8);
var mesh03 = new THREE.Mesh(geometry02,material02);
scene.add(mesh03);
mesh03.position.set(-.5,2.3,1.8);



//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {
    //🪄🪄 Animación - 





    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();
    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
