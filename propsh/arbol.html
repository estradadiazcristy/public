<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>arbol1</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;


// Espacio para colocar los objetos
        var tronco = new THREE.CylinderGeometry(0.35, 0.5, 2.5, 16);
        var mattronco = new THREE.MeshBasicMaterial({ color: 0x3d2817 });
        var troncomesh = new THREE.Mesh(tronco, mattronco);
        troncomesh.position.y = -2;
        scene.add(troncomesh);

        var hojas = new THREE.SphereGeometry(1.4, 16, 16);
        var hojasmat = new THREE.MeshBasicMaterial({ color: 0x1b381b});
        var hojacenmesh = new THREE.Mesh(hojas, hojasmat);
        hojacenmesh.scale.set(1.4, 1.0, 1.3);
        scene.add(hojacenmesh);   
        
        var h1 = new THREE.SphereGeometry(1.0, 12, 12);
        var h1mesh = new THREE.Mesh(h1, hojasmat);
        h1mesh.position.set(1.2, 0.2, 0.5);
        hojacenmesh.add(h1mesh);  
        
        var h2 = new THREE.SphereGeometry(1.1, 12, 12);
        var h2mesh = new THREE.Mesh(h2, hojasmat);
        h2mesh.position.set(-1.3, 0.3, -0.4);
        hojacenmesh.add(h2mesh);  
        
        var h3 = new THREE.SphereGeometry(1.2, 12, 12);
        var h3mesh = new THREE.Mesh(h3, hojasmat);
        h3mesh.position.set(0.2, 1.2, -0.8);
        hojacenmesh.add(h3mesh);  

        var h4 = new THREE.SphereGeometry(1.0, 12, 12);
        var h4mesh = new THREE.Mesh(h4, hojasmat);
        h4mesh.position.set(-0.5, 1.0, 0.9);
        hojacenmesh.add(h4mesh);  


  
//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
