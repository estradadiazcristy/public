<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>tamal</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;


// Espacio para colocar los objetos
    
     var plato01 = new THREE.CylinderGeometry(6, 4,1.5, 32);
        var materialp = new THREE.MeshBasicMaterial({ color: 0xe0e0e0, side: THREE.DoubleSide });
        var meshp = new THREE.Mesh(plato01, materialp);
        meshp.position.set(0, 0, 0);
        scene.add(meshp);

        var tamal01 = new THREE.CylinderGeometry(1.5,1.5,5,20);
        var materialt = new THREE.MeshBasicMaterial({
             color: 0xffff66
            });

        var mesht = new THREE.Mesh(tamal01, materialt);
        mesht.scale.set(1.3, 1, 0.8);
        mesht.rotation.set(Math.PI / 2, 0, 0);
        mesht.position.set(-2, 1, 0);
        scene.add(mesht);

 var cen01 = new THREE.CylinderGeometry(1.55,1.55,0.3,20,1,true);
        var materialcen = new THREE.MeshBasicMaterial({
             color: 0x996600,
             side: THREE.DoubleSide
            });

        var meshcen = new THREE.Mesh(cen01, materialcen);
        mesht.add(meshcen);

        var UNOT = new THREE.Group();
UNOT.add(mesht);
scene.add(UNOT);

var DOST = UNOT.clone();
scene.add(DOST);
DOST.position.set(4, 0, 0);

var TREST = UNOT.clone();
scene.add(TREST);
TREST.position.set(0, 0, -3);
TREST.rotation.set(-1, Math.PI / 2, 0);

var CUATROT = UNOT.clone();
scene.add(CUATROT);
CUATROT.position.set(0, 1, 5);
CUATROT.rotation.set(0,Math.PI / 2, 4);

var CINCOT = UNOT.clone();
scene.add(CINCOT);
CINCOT.position.set(2, 2, 0);

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
