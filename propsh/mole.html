<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <title>mole</title>
</head>
<body>
    
<canvas id="myCanvas">
    <!--El elemento HTML canvas se puede utilizar para dibujar gráficos a través de 
        secuencias de comandos (por lo general JavaScript ).-->
</canvas>

<!-- Aquí va todo el código de three.js -->
<!-- script type="importmap" importa las librerías necesarias para three.js-->
<script type="importmap"> 
    {
        "imports":{
            "three": "./js/three.module.js",
            "three/OrbitControls": "./js/OrbitControls.js" 
        }
}
</script>
<script type="module"> 
//🗃️🗃️ Mandar llamar a la librería
    import * as THREE from 'three'; 
    import {OrbitControls} from 'three/OrbitControls';
    console.log(OrbitControls);

//🕹️🕹️ Renderer - Realiza una conexión entre el código y el canvas
    var renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('myCanvas'), antialias: true,
    });
    renderer.setPixelRatio(window.decivePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x70707C);


// 🎬 Creando nueva escena - Es el espacio donde se colocan los objetos
    var scene = new THREE.Scene();

//🎥🎥 Agregar una cámara de perspectiva
    var camera = new THREE.PerspectiveCamera(70,window.innerWidth / window.innerHeight,0.1,2000
      );
    scene.add(camera);

    //Settings de la cámara
    camera.position.set(0, 4, 10);

    // Añadiendo los OrbitControls
    var controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;


// Espacio para colocar los objetos
    //PLATO
    var plato = new THREE.CylinderGeometry(4, 3, 0.3, 32);
    var platomat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    var platomesh = new THREE.Mesh(plato,platomat);
        platomesh.scale.set(1.4, 1, 1);
        scene.add(platomesh);


        //MOLE
        var mole = new THREE.CylinderGeometry(3.5, 3.5, 0.1, 32);
        var molemat = new THREE.MeshBasicMaterial({ color: 0x3a1700 });
        var molemesh = new THREE.Mesh(mole, molemat);
        molemesh.position.y = 0.15;
        molemesh.scale.set(1.3, 1, 0.9);
        scene.add(molemesh);
    
    //arroz
    var arroz = new THREE.SphereGeometry(1.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    var arrozmat = new THREE.MeshBasicMaterial({ color: 0xff7700 });
    var arrozmesh = new THREE.Mesh(arroz, arrozmat);
        arrozmesh.position.set(-2, 0.2, 0);
        scene.add(arrozmesh);


    var hoja = new THREE.SphereGeometry(0.3, 8, 8);
        var hojamat = new THREE.MeshBasicMaterial({ color: 0x00aa22 });
        var hojamesh = new THREE.Mesh(hoja, hojamat);
        hojamesh.position.set(-2, 1.7, 0);
        hojamesh.scale.set(1, 0.3, 1);
        scene.add(hojamesh);

 //pollo
    var pollo = new THREE.SphereGeometry(1.1, 16, 16);
        var pollomat = new THREE.MeshBasicMaterial({ color: 0x4a210d });
        var pollomesh = new THREE.Mesh(pollo, pollomat);
        pollomesh.position.set(0.8, 0.8, 0);
        pollomesh.scale.set(1.3, 0.8, 1);
        scene.add(pollomesh);

    var hueso = new THREE.CylinderGeometry(0.15, 0.15, 2.5, 8);
    var huesomat = new THREE.MeshBasicMaterial({ color: 0xf5f5dc });
        var huesomesh = new THREE.Mesh(hueso, huesomat);
        huesomesh.position.set(2, 1, 0);
        huesomesh.rotation.z = -Math.PI / 2.5;
        scene.add(huesomesh);   

    var circulohueso = new THREE.SphereGeometry(0.2, 12, 12);
    var circulomesh = new THREE.Mesh(circulohueso, huesomat);
        circulomesh.position.set(3.3, 1.4, -0.2);
        scene.add(circulomesh);

        var circulo2mesh = new THREE.Mesh(circulohueso,huesomat);
        circulo2mesh.position.set(3.3, 1.4, 0.1);
        scene.add(circulo2mesh);

//🎰🎰Rendering y animación
    requestAnimationFrame(render);
    function render() {

    //🪄🪄 Animación - 

    //🎮🎮Actualización del OrbitControls para generar la suavidad de movimiento
    controls.update();

    //Llamado para renderizar y volver a llamar a la misma función (render)
    renderer.render(scene, camera);
    requestAnimationFrame(render);
    }
</script>
</body>
</html>
